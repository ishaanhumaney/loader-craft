<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Loading Spinners Suite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Loading Spinners Showcase</h1>

    <div class="spinner-container">
        <div class="card">
            <h3>Classic Ring</h3>
            <div class="spinner ring"></div>
        </div>

        <div class="card">
            <h3>Pulsing Dots</h3>
            <div class="dots-container">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="card">
            <h3>Double Ring</h3>
            <div class="double-ring">
                <div class="inner-ring"></div>
            </div>
        </div>

        <div class="card">
            <h3>Fading Bar</h3>
            <div class="bar-spinner"></div>
        </div>

        <div class="card">
            <h3>Skeleton Loader</h3>
            <div class="skeleton-wrapper">
                <div class="skeleton avatar"></div>
                <div class="skeleton-lines">
                    <div class="skeleton line title"></div>
                    <div class="skeleton line body"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
